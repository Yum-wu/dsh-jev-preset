name: JEV Preset CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Lint, Test & Assertion Guard
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        node-version: [ 20.x, 22.x ]
        python-version: [ "3.12" ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tzdata (Windows Python lacks IANA time zones)
        run: |
          # Windows 的 Python 不自带 IANA 时区库(TZPATH 为空),
          # tests/test_accuracy_bench.py 的 zoneinfo 独立比对会抛 ZoneInfoNotFoundError。
          # 该测试是准确率基准最强的独立证据之一,必须让它真实运行而非跳过。
          python -m pip install --disable-pip-version-check tzdata

      - name: Guard Tracked Package Files Present
        run: |
          python -c "import pathlib,sys; req=['packages/assertions/python/jev_assertions/__init__.py','packages/assertions/python/jev_assertions/tick.py','packages/assertions/python/jev_assertions/margin.py','packages/assertions/python/jev_assertions/slippage.py','packages/assertions/python/jev_assertions/calendar.py','packages/assertions/python/jev_assertions/split.py','packages/assertions/python/jev_assertions/cli.py','tests/test_assertions.py','benchmarks/run_stress_matrix.py']; miss=[p for p in req if not pathlib.Path(p).is_file()]; print('missing:',miss); sys.exit(1 if miss else 0)"

      - name: Run Python Assertion Regression Guard
        run: |
          python tests/test_assertions.py

      - name: Run Accuracy Benchmark Self-Guard
        run: |
          # 守护准确率基准本身:参考解三类独立证据 + 判分器双向自检(20 seed)。
          # 若因缺 tzdata 导致 zoneinfo 比对被跳过,此处显式失败 —— 不允许静默降级。
          python -c "import zoneinfo,sys; zoneinfo.ZoneInfo('America/New_York'); print('tzdata OK')" || (echo '::error::zoneinfo 不可用,tzdata 安装失败,准确率基准的独立比对会被跳过' && exit 1)
          python tests/test_accuracy_bench.py

      - name: Run Quantitative Stress Benchmark Matrix
        run: |
          python benchmarks/run_stress_matrix.py

      - name: Guard Generated Artifacts Not Modified By Scripts
        shell: bash
        run: |
          # run_stress_matrix.py 会重写 benchmark-results.json。
          # 若重跑后产物与入库版本不一致,说明脚本改了输出却没同步入库
          # (或结果依赖环境),必须显式提交,不能静默漂移。
          # 用 --exit-code 而非 --quiet,以便 CI 日志显示差异。
          if ! git diff --exit-code -- benchmarks/benchmark-results.json; then
            echo "::error::benchmarks/benchmark-results.json 被脚本重写且与入库版本不一致。"
            echo "::error::请本地跑 python benchmarks/run_stress_matrix.py 后提交结果,或确认输出已确定性。"
            exit 1
          fi
          echo "生成物与入库版本一致(确定性输出)"

      - name: Run Circuit Breaker Unit Test
        run: |
          node tests/test-circuit-breaker.mjs

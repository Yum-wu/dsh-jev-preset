name: JEV Preset CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Lint, Test & Assertion Guard
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        node-version: [ 20.x, 22.x ]
        python-version: [ "3.12" ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Python Assertion Regression Guard
        run: |
          python tests/test_assertions.py

      - name: Run Quantitative Stress Benchmark Matrix
        run: |
          python benchmarks/run_stress_matrix.py

      - name: Run Circuit Breaker Unit Test
        run: |
          node tests/test-circuit-breaker.mjs
